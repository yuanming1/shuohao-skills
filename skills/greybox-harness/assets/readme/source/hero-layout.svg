<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="660" viewBox="0 0 1200 660"
     role="img" aria-labelledby="t d">
  <title id="t">VLM-Generation-Harness</title>
  <desc id="d">Three frames from the same camera: the coloured review greybox a human signs off, the flat grey pass the video model receives, and the generated result. Below them, the planned cut points and the measured deviation.</desc>

  <defs>
    <clipPath id="p1"><rect x="56"  y="240" width="344" height="194" rx="10"/></clipPath>
    <clipPath id="p2"><rect x="424" y="240" width="344" height="194" rx="10"/></clipPath>
    <clipPath id="p3"><rect x="792" y="240" width="344" height="194" rx="10"/></clipPath>
    <style>
      .ui   { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
      .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    </style>
  </defs>

  <rect width="1200" height="660" rx="24" fill="#0E1012"/>

  <!-- ── title block ── -->
  <g id="title-block">
    <text class="mono" x="56" y="68" font-size="19" letter-spacing="2.6" fill="#8B9198">BLENDER GREYBOX &#8594; VIDEO MODEL</text>
    <text class="ui" x="56" y="132" font-size="56" font-weight="700" fill="#E9EAEB">VLM-Generation-Harness</text>
    <text class="ui" x="56" y="174" font-size="23" fill="#B9BEC3">Camera, space and cut timing are geometry. Look and performance are text.</text>
    <text class="mono" x="1136" y="68" font-size="17" text-anchor="end" fill="#6E757C">MIT &#183; Blender 5.x &#183; ffmpeg</text>
  </g>

  <!-- ── three frames, one camera ── -->
  <g id="proof">
    <text class="mono" x="56"  y="222" font-size="18" fill="#E9EAEB">01 REVIEW PASS<tspan fill="#6E757C">   you confirm this</tspan></text>
    <text class="mono" x="424" y="222" font-size="18" fill="#E9EAEB">02 MODEL PASS<tspan fill="#6E757C">   the model gets this</tspan></text>
    <text class="mono" x="792" y="222" font-size="18" fill="#E9EAEB">03 GENERATED<tspan fill="#6E757C">   Seedance 2.5</tspan></text>

    <rect x="56"  y="232" width="344" height="3" rx="1.5" fill="#FF6B0F"/>
    <rect x="424" y="232" width="344" height="3" rx="1.5" fill="#8B9198"/>
    <rect x="792" y="232" width="344" height="3" rx="1.5" fill="#337AEB"/>

    <image xlink:href="panel-review.png"    x="56"  y="240" width="344" height="194" clip-path="url(#p1)" preserveAspectRatio="xMidYMid slice"/>
    <image xlink:href="panel-model.png"     x="424" y="240" width="344" height="194" clip-path="url(#p2)" preserveAspectRatio="xMidYMid slice"/>
    <image xlink:href="panel-generated.png" x="792" y="240" width="344" height="194" clip-path="url(#p3)" preserveAspectRatio="xMidYMid slice"/>

    <path d="M404 331 l9 6 -9 6" fill="none" stroke="#5A6169" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M772 331 l9 6 -9 6" fill="none" stroke="#5A6169" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <text class="mono" x="56" y="468" font-size="18" fill="#6E757C">same camera &#8212; A_window &#183; 45mm &#183; (0.80, 0.75, 1.58) &#8594; (&#8722;1.10, 3.55, 1.14)</text>
  </g>

  <line x1="56" y1="500" x2="1136" y2="500" stroke="#242A2F" stroke-width="1.5"/>

  <!-- ── cut ruler: the recurring motif ── -->
  <g id="cut-ruler">
    <text class="mono" x="56" y="532" font-size="18" fill="#8B9198">CUT POINTS &#8212; planned vs. measured</text>

    <line x1="56" y1="570" x2="1136" y2="570" stroke="#3A4147" stroke-width="2"/>
    <!-- second ticks -->
    <g stroke="#2C3237" stroke-width="1.5">
      <line x1="123.5" y1="564" x2="123.5" y2="576"/><line x1="191"  y1="564" x2="191"  y2="576"/>
      <line x1="258.5" y1="564" x2="258.5" y2="576"/><line x1="326"  y1="564" x2="326"  y2="576"/>
      <line x1="393.5" y1="564" x2="393.5" y2="576"/><line x1="461"  y1="564" x2="461"  y2="576"/>
      <line x1="528.5" y1="564" x2="528.5" y2="576"/><line x1="596"  y1="564" x2="596"  y2="576"/>
      <line x1="663.5" y1="564" x2="663.5" y2="576"/><line x1="731"  y1="564" x2="731"  y2="576"/>
      <line x1="798.5" y1="564" x2="798.5" y2="576"/><line x1="866"  y1="564" x2="866"  y2="576"/>
      <line x1="933.5" y1="564" x2="933.5" y2="576"/><line x1="1001" y1="564" x2="1001" y2="576"/>
      <line x1="1068.5" y1="564" x2="1068.5" y2="576"/>
    </g>
    <!-- the six hard cuts -->
    <g stroke="#FF6B0F" stroke-width="3" stroke-linecap="round">
      <line x1="272" y1="548" x2="272" y2="592"/>
      <line x1="393.5" y1="548" x2="393.5" y2="592"/>
      <line x1="555.5" y1="548" x2="555.5" y2="592"/>
      <line x1="677" y1="548" x2="677" y2="592"/>
      <line x1="839" y1="548" x2="839" y2="592"/>
      <line x1="947" y1="548" x2="947" y2="592"/>
    </g>
    <g class="mono" font-size="16" fill="#8B9198" text-anchor="middle">
      <text x="272" y="614">3.2</text><text x="393.5" y="614">5.0</text><text x="555.5" y="614">7.4</text>
      <text x="677" y="614">9.2</text><text x="839" y="614">11.6</text><text x="947" y="614">13.2</text>
    </g>
    <text class="mono" x="56"   y="614" font-size="16" fill="#5A6169">0.0s</text>
    <text class="mono" x="1136" y="614" font-size="16" fill="#5A6169" text-anchor="end">16.0s</text>

    <text class="ui" x="1136" y="536" font-size="22" font-weight="600" text-anchor="end" fill="#E9EAEB"><tspan fill="#FF6B0F">6 / 6</tspan> hit &#183; max &#916; 0.07s &#183; 0 spurious</text>
  </g>
</svg>
